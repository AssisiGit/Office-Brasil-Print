<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css" />
    <script defer src="login.js"></script>
    <title>Abrir Chamado</title>
</head>

<body>
    <header class="header">
        <h2 class="logo"> Logo </h2>
        <nav class="navigation">
            <a href="#">Produtos</a>
            <a href="#">Quem Somos</a>
            <a href="#">Fale Conosco</a>
            <button class="btlogin" onclick="BackHome()">Home</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icon-close"><ion-icon name="information-circle-outline"></ion-icon></span>


        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">
                
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input type="text" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" required>
                    <label>Senha</label>
                </div>
                <div class="remember-forgot">
                    <br>
                    <label><input type="checkbox"> Lembrar de Mim </label>
                    <br>
                    <br>
                    <a  class="Forgotpassword" href="#">Esqueceu a sua Senha ?</a>
                </div>
                <button type="submit" class="btn">Logi]</button>
                <div class="login-register">
                    <p>Não Possui uma conta ?<a href="#" class="register-link">Registre-se</a></p>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <h2>Faça seu Registro</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                    <input type="text" required>
                    <label>Usuario</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                    <input type="text" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" required>
                    <label>Senha</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"><a href="#">Eu concordo com os termos de uso</a> </label>
                  
                </div>
                <button type="submit" class="btn">Registrar</button>
                <div class="login-register">
                    <p>Já possui um Registro ?<a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
